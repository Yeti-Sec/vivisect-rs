[package]
name = "vivisect"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["vivisect-rs contributors"]
description = "A pure Rust disassembler, debugger, emulator, and static analysis framework"
license = "Apache-2.0"
repository = "https://github.com/Yeti-Sec/vivisect-rs"
keywords = ["disassembler", "debugger", "emulator", "reverse-engineering", "binary-analysis"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "vivisect"
path = "src/lib.rs"

[[bin]]
name = "vivbin"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"  # msgpack backend

# Binary parsing
goblin = "0.8"  # PE, ELF, Mach-O parsing

# Disassembly
capstone = "0.12"  # Multi-architecture disassembly (ARM, MIPS, etc.)
iced-x86 = "1.21"  # x86/x64 disassembly and assembly

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Collections and utilities
indexmap = { version = "2.1", features = ["serde"] }
bitflags = "2.4"
byteorder = "1.5"

# Graph algorithms
petgraph = "0.6"

# Hex encoding
hex = "0.4"

# Sample hashing (file identity / function IDs)
md5 = "0.7"

# Async (optional, for remote server)
tokio = { version = "1.35", features = ["full"], optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

# Optional: Unicorn-based emulation backend
unicorn-engine = { version = "2.0", optional = true }

# Optional: Icicle emulator (SLEIGH-backed CPU emulation)
icicle-vm  = { git = "https://github.com/icicle-emu/icicle-emu", rev = "51558fc", optional = true }
icicle-cpu = { git = "https://github.com/icicle-emu/icicle-emu", rev = "51558fc", optional = true }
icicle-mem = { git = "https://github.com/icicle-emu/icicle-emu", rev = "51558fc", optional = true }
target-lexicon = { version = "0.13", optional = true }


[dev-dependencies]
criterion = "0.5"
tempfile = "3.9"

[features]
default = []
emulation = ["unicorn-engine"]
icicle = ["icicle-vm", "icicle-cpu", "icicle-mem", "target-lexicon"]
remote = ["tokio", "axum", "tower"]
full = ["icicle", "remote"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# --- Lint policy -------------------------------------------------------------
# Applies to all targets (lib, vivbin, tests, examples). CI runs
# `cargo clippy --all-targets -- -D warnings` on the default feature set.
# `--all-features` additionally requires a full C toolchain (unicorn-engine-sys
# needs `stdbool.h` and friends); it is not required for the default build.
#
# The categories below scope pre-existing documentation / analysis-scaffolding
# debt inherited from the original ported crate, so `-D warnings` gates genuine
# code issues rather than missing-docs noise on hundreds of pre-existing public
# items.
[lints.rust]
missing_docs = "allow"        # pre-existing undocumented public API
dead_code = "allow"           # analysis-framework scaffolding kept for future use
unused_must_use = "allow"     # pre-existing parity-test fixtures ignore add_* results

[lints.clippy]
double_must_use = "allow"          # VivResult is already #[must_use]
type_complexity = "allow"
too_many_arguments = "allow"
ptr_arg = "allow"
if_same_then_else = "allow"         # pre-existing arch/symboliks placeholder branches
should_implement_trait = "allow"    # symboliks add/sub are domain methods, not std ops
manual_checked_ops = "allow"        # pre-existing symboliks
assertions_on_constants = "allow"   # pre-existing tests
