[package]
name = "vivisect"
version = "0.1.0"
edition = "2021"
authors = ["rust-vivisect contributors"]
description = "A pure Rust disassembler, debugger, emulator, and static analysis framework"
license = "Apache-2.0"
repository = "https://github.com/yeti-sec/rust-vivisect"
keywords = ["disassembler", "debugger", "emulator", "reverse-engineering", "binary-analysis"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "vivisect"
path = "src/lib.rs"

[[bin]]
name = "vivbin"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"

# Binary parsing
goblin = "0.10"
object = "0.36"
scroll = "0.12"

# Disassembly
capstone = "0.14"
iced-x86 = "1.21"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Collections and utilities
indexmap = { version = "2.1", features = ["serde"] }
bitflags = "2.11"
bitvec = "1.0"
byteorder = "1.5"
bytes = "1.5"
memmap2 = "0.9"
num-traits = "0.2"
num-derive = "0.4"
lazy_static = "1.4"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"

# Graph algorithms
petgraph = "0.6"

# Regex
regex = "1.10"

# C++ demangling
cpp_demangle = "0.4"

# Hex encoding
hex = "0.4"

# Async (optional, for remote capabilities)
tokio = { version = "1.50", features = ["full"], optional = true }

# Optional: Emulation backends
unicorn-engine = { version = "2.0", optional = true }

# Icicle emulator (vendored, optional)
icicle-vm = { path = "deps/rust-icicle-emu/icicle-vm", optional = true }
icicle-cpu = { path = "deps/rust-icicle-emu/icicle-cpu", optional = true }
icicle-mem = { path = "deps/rust-icicle-emu/icicle-mem", optional = true }
target-lexicon = { version = "0.12", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.26"

[features]
default = []
emulation = ["unicorn-engine"]
icicle = ["icicle-vm", "icicle-cpu", "icicle-mem", "target-lexicon"]
remote = ["tokio"]
full = ["icicle", "remote"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
